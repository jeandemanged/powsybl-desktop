name: CI

on:
  push:
    branches:
      - '**'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B clean install -DforkCount=1C

  user-guide:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: ./.github/actions/build-user-guide

      - name: Stage the user's guide
        shell: bash
        run: |
          mkdir -p "target/user-guide/${{ matrix.platform }}"
          cp -R docs/ug/_build/html "target/user-guide/${{ matrix.platform }}/html"
          cp docs/ug/_build/latex/powsybl-desktop-user-guide.pdf "target/user-guide/${{ matrix.platform }}/"

      - uses: actions/upload-artifact@v7
        with:
          name: user-guide-${{ matrix.platform }}
          path: target/user-guide
          if-no-files-found: error

  # A single "user-guide" artifact with a folder per platform, from the platforms that could build it
  user-guide-artifact:
    needs: user-guide
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v7
        with:
          name: user-guide
          pattern: user-guide-*
          delete-merged: true
