name: Package & pre-release

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  JAVAFX_VERSION: '27'

jobs:
  prep:
    # workflow_dispatch can be run from any branch that has this file; only "init" actually publishes.
    if: github.ref == 'refs/heads/init'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - id: vars
        run: |
          echo "version=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  package:
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            jmods_os: windows-x64
          - os: ubuntu-latest
            platform: linux
            jmods_os: linux-x64
          - os: macos-latest
            platform: macos
            jmods_os: osx-aarch64 # GitHub's macos-latest runners are Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Download JavaFX jmods
        shell: bash
        run: |
          curl -fsSL -o javafx-jmods.zip \
            "https://download2.gluonhq.com/openjfx/${JAVAFX_VERSION}/openjfx-${JAVAFX_VERSION}_${{ matrix.jmods_os }}_bin-jmods.zip"
          unzip -q javafx-jmods.zip -d javafx-jmods
          # Locate the extracted *.jmod directory rather than hardcoding it, since the zip's
          # internal folder name is version-specific (e.g. "javafx-jmods-27/").
          jmods_dir="$(dirname "$(find javafx-jmods -name '*.jmod' | head -n1)")"
          echo "JMODS_DIR=$jmods_dir" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/package-windows.ps1 -JavafxJmods "$env:JMODS_DIR"

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: ./packaging/package-linux.sh "$JMODS_DIR"

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: ./packaging/package-macos.sh "$JMODS_DIR"

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "powsybl-desktop-${{ needs.prep.outputs.version }}-${{ needs.prep.outputs.sha }}-windows.zip"
          Compress-Archive -Path "target/dist/PowSyBl Desktop" -DestinationPath $name
          echo "ARCHIVE_NAME=$name" >> $env:GITHUB_ENV

      - name: Create archive (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          name="powsybl-desktop-${{ needs.prep.outputs.version }}-${{ needs.prep.outputs.sha }}-linux.tar.gz"
          tar -czf "$name" -C target/dist "PowSyBl Desktop"
          echo "ARCHIVE_NAME=$name" >> "$GITHUB_ENV"

      - name: Create archive (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          name="powsybl-desktop-${{ needs.prep.outputs.version }}-${{ needs.prep.outputs.sha }}-macos.zip"
          # ditto (not zip/tar) preserves the .app bundle's resource fork/permissions correctly - the
          # same tool Xcode itself uses to archive app bundles.
          ditto -c -k --sequesterRsrc --keepParent "target/dist/PowSyBl Desktop.app" "$name"
          echo "ARCHIVE_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: powsybl-desktop-${{ matrix.platform }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

  release:
    needs: [prep, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="pre-release-${{ needs.prep.outputs.version }}-${{ needs.prep.outputs.sha }}"
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --title "PowSyBl Desktop pre-release ${{ needs.prep.outputs.version }} (${{ needs.prep.outputs.sha }})" \
            --notes "Automated pre-release build from commit ${{ github.sha }} on branch init." \
            --prerelease \
            --target "${{ github.sha }}"

      - name: Purge old pre-releases (keep newest 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 200 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[5:][].tagName' \
          | while read -r old_tag; do
              echo "Deleting old pre-release: $old_tag"
              gh release delete "$old_tag" --repo "${{ github.repository }}" --yes --cleanup-tag
            done
