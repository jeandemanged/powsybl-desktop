name: Package & pre-release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

env:
  JAVAFX_VERSION: '27'

jobs:
  prep:
    # workflow_dispatch can be run from any branch that has this file; only "main" actually publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Semver: X.Y.Z-SNAPSHOT becomes the pre-release X.Y.Z-beta.YYYYMMDD.<sha>
      - id: vars
        run: |
          pom_version="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          case "$pom_version" in
            *-SNAPSHOT) version="${pom_version%-SNAPSHOT}-beta.$(date -u +%Y%m%d).${GITHUB_SHA::7}" ;;
            *) version="$pom_version" ;;
          esac
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Tag now, once, so every platform builds against the exact same fixed ref instead of the
      # (potentially moving) branch tip.
      - name: Create and push tag
        run: |
          git tag "${{ steps.vars.outputs.tag }}" "${{ github.sha }}"
          git push origin "${{ steps.vars.outputs.tag }}"

  package:
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            jmods_os: windows-x64
          - os: ubuntu-latest
            platform: linux
            jmods_os: linux-x64
          - os: macos-latest
            platform: macos
            jmods_os: osx-aarch64 # GitHub's macos-latest runners are Apple Silicon
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prep.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep.outputs.tag }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # to docs/ug/_build, where the packaging scripts take it from
      - uses: ./.github/actions/build-user-guide

      - name: Download JavaFX jmods
        shell: bash
        run: |
          curl -fsSL -o javafx-jmods.zip \
            "https://download2.gluonhq.com/openjfx/${JAVAFX_VERSION}/openjfx-${JAVAFX_VERSION}_${{ matrix.jmods_os }}_bin-jmods.zip"
          unzip -q javafx-jmods.zip -d javafx-jmods
          # Locate the extracted *.jmod directory rather than hardcoding it, since the zip's
          # internal folder name is version-specific (e.g. "javafx-jmods-27/").
          jmods_dir="$(dirname "$(find javafx-jmods -name '*.jmod' | head -n1)")"
          echo "JMODS_DIR=$jmods_dir" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/package-windows.ps1 -JavafxJmods "$env:JMODS_DIR"

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: ./packaging/package-linux.sh "$JMODS_DIR"

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: ./packaging/package-macos.sh "$JMODS_DIR"

      # Each archive holds a single "PowSyBl Desktop <version>" folder, so that versions extract side by side
      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "powsybl-desktop-$env:VERSION-windows.zip"
          $folder = "target/dist/PowSyBl Desktop $env:VERSION"
          Move-Item -LiteralPath "target/dist/PowSyBl Desktop" -Destination $folder
          Compress-Archive -LiteralPath $folder -DestinationPath $name
          echo "ARCHIVE_NAME=$name" >> $env:GITHUB_ENV

      - name: Create archive (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          name="powsybl-desktop-$VERSION-linux.tar.gz"
          folder="PowSyBl Desktop $VERSION"
          mv "target/dist/PowSyBl Desktop" "target/dist/$folder"
          tar -czf "$name" -C target/dist "$folder"
          echo "ARCHIVE_NAME=$name" >> "$GITHUB_ENV"

      - name: Create archive (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          name="powsybl-desktop-$VERSION-macos.zip"
          # The versioned folder wraps the bundle, which keeps its plain name once moved to /Applications
          folder="target/dist/PowSyBl Desktop $VERSION"
          mkdir "$folder"
          mv "target/dist/PowSyBl Desktop.app" "$folder/"
          # ditto (not zip/tar) preserves the .app bundle's resource fork/permissions correctly - the
          # same tool Xcode itself uses to archive app bundles.
          ditto -c -k --sequesterRsrc --keepParent "$folder" "$name"
          echo "ARCHIVE_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: powsybl-desktop-${{ matrix.platform }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

      - name: Stage the user's guide
        shell: bash
        run: |
          mkdir -p "user-guide/${{ matrix.platform }}"
          cp -R docs/ug/_build/html "user-guide/${{ matrix.platform }}/html"
          cp docs/ug/_build/latex/powsybl-desktop-user-guide.pdf "user-guide/${{ matrix.platform }}/"

      - uses: actions/upload-artifact@v7
        with:
          name: user-guide-${{ matrix.platform }}
          path: user-guide
          if-no-files-found: error

  release:
    needs: [prep, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: powsybl-desktop-*
          path: dist
          merge-multiple: true

      # each artifact holds its platform's folder: merged, they make one user-guide/{windows,linux,macos} tree
      - uses: actions/download-artifact@v8
        with:
          pattern: user-guide-*
          path: user-guide
          merge-multiple: true

      - name: Archive the user's guide
        run: zip -qr "dist/powsybl-desktop-${{ needs.prep.outputs.version }}-user-guide.zip" user-guide

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.prep.outputs.tag }}"
          # The tag was already created and pushed in "prep", pointing at the exact commit that was
          # built - no --target needed. Deliberately not flagged as a GitHub prerelease (no
          # --prerelease) so it shows up as a normal release; --latest marks it as the release
          # GitHub highlights, since without it that's decided by date/version heuristics we don't
          # control (and GitHub never treats a semver pre-release tag as latest on its own).
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "Automated pre-release build from commit ${{ github.sha }} on branch main." \
            --latest

      - name: Purge old pre-releases (keep newest 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 200 \
            --json tagName,name,createdAt \
            --jq '[.[] | select(.name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-beta\\.[0-9]{8}\\.[0-9a-f]{7}$"))] | sort_by(.createdAt) | reverse | .[5:][].tagName' \
          | while read -r old_tag; do
              echo "Deleting old pre-release: $old_tag"
              gh release delete "$old_tag" --repo "${{ github.repository }}" --yes --cleanup-tag
            done
