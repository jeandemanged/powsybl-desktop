name: Build the user's guide
description: >
  Takes the user's guide screenshots and builds its HTML and PDF to docs/ug/_build, on the runner's OS (screenshots
  differ between platforms). Java and Maven must already be set up.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: docs/ug/requirements.txt

    # TeX Live on every OS (on Windows, it also brings the Perl that latexmk needs); cached between runs
    - uses: teatimeguest/setup-texlive-action@v3
      with:
        packages: |
          scheme-basic
          babel-english
          collection-fontsrecommended
          collection-latexrecommended
          collection-latexextra
          latexmk

    - name: Take the screenshots
      shell: bash
      run: mvn -B test -Pug-screenshots

    - name: Build the HTML and the PDF
      shell: bash
      working-directory: docs/ug
      run: |
        pip install -r requirements.txt
        python -m sphinx -M html . _build -W --keep-going
        python -m sphinx -M latexpdf . _build
